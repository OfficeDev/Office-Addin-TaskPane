steps:
- task: Npm@1
  displayName: 'Install'
  inputs:
    command: custom
    # Skip package install scripts. The native keytar module (pulled in transitively)
    # downloads its prebuilt binary from a host that is unreachable under the pipeline's
    # network isolation policy, then falls back to building from source and fails.
    # Nothing this pipeline runs needs a compiled native module.
    customCommand: 'install --ignore-scripts'
